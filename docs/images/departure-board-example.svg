<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Generic split-flap public transport departure board</title>
  <desc id="desc">A black aircraft-instrument-style departure board with S-Bahn, bus, regional train and tram rows, including one delayed service.</desc>
  <defs>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2e"/>
      <stop offset="0.28" stop-color="#151517"/>
      <stop offset="0.72" stop-color="#050506"/>
      <stop offset="1" stop-color="#1b1b1d"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242426"/>
      <stop offset="0.48" stop-color="#101012"/>
      <stop offset="0.52" stop-color="#060607"/>
      <stop offset="1" stop-color="#1c1c1e"/>
    </linearGradient>
    <radialGradient id="screw" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#77797d"/>
      <stop offset="0.25" stop-color="#303236"/>
      <stop offset="0.75" stop-color="#070708"/>
      <stop offset="1" stop-color="#4f5155"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <pattern id="cells" width="29" height="58" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="25" height="54" rx="3" fill="url(#cell)" stroke="#000" stroke-width="1"/>
      <line x1="2" y1="28" x2="25" y2="28" stroke="#000" stroke-width="1.2"/>
      <line x1="3" y1="29" x2="24" y2="29" stroke="#424246" stroke-opacity="0.16"/>
      <rect x="3" y="3" width="21" height="50" rx="2" fill="none" stroke="#fff" stroke-opacity="0.035"/>
    </pattern>
    <style>
      .heading{font:700 31px Arial, sans-serif;letter-spacing:1.5px;fill:#f0f0eb}
      .sub{font:400 16px Arial, sans-serif;letter-spacing:1.1px;fill:#c4c4bd}
      .clock{font:500 30px 'DejaVu Sans Mono',monospace;fill:#f4c900}
      .hdr{font:500 14px Arial,sans-serif;letter-spacing:.7px;fill:#a8a79f}
      .flap{font:500 31px 'DejaVu Sans Mono',monospace;letter-spacing:8px;fill:#f4c900}
      .flap-tight{font:500 31px 'DejaVu Sans Mono',monospace;letter-spacing:6px;fill:#f4c900}
      .delay{font:500 29px 'DejaVu Sans Mono',monospace;letter-spacing:5px;fill:#ff5365}
      .iconText{font:700 24px Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>

  <rect width="1400" height="650" fill="#0b1016"/>
  <g filter="url(#shadow)">
    <rect x="55" y="38" width="1290" height="574" rx="13" fill="url(#housing)" stroke="#050506" stroke-width="4"/>
    <rect x="62" y="45" width="1276" height="560" rx="9" fill="none" stroke="#8e8e8b" stroke-width="1.2"/>
    <rect x="67" y="50" width="1266" height="550" rx="7" fill="none" stroke="#050506" stroke-width="3"/>

    <g>
      <circle cx="82" cy="64" r="16" fill="url(#screw)" stroke="#020203" stroke-width="2"/>
      <path d="M72 64h20M82 54v20" stroke="#08090a" stroke-width="3" stroke-linecap="round" transform="rotate(-18 82 64)"/>
      <circle cx="1318" cy="64" r="16" fill="url(#screw)" stroke="#020203" stroke-width="2"/>
      <path d="M1308 64h20M1318 54v20" stroke="#08090a" stroke-width="3" stroke-linecap="round" transform="rotate(12 1318 64)"/>
      <circle cx="82" cy="586" r="16" fill="url(#screw)" stroke="#020203" stroke-width="2"/>
      <path d="M72 586h20M82 576v20" stroke="#08090a" stroke-width="3" stroke-linecap="round" transform="rotate(8 82 586)"/>
      <circle cx="1318" cy="586" r="16" fill="url(#screw)" stroke="#020203" stroke-width="2"/>
      <path d="M1308 586h20M1318 576v20" stroke="#08090a" stroke-width="3" stroke-linecap="round" transform="rotate(-12 1318 586)"/>
    </g>

    <text x="105" y="104" class="heading">DEPARTURES</text>
    <text x="105" y="135" class="sub">CENTRAL STATION</text>
    <text x="1244" y="121" class="clock">18:42</text>

    <text x="210" y="165" class="hdr">TIME</text>
    <text x="385" y="165" class="hdr">LINE</text>
    <text x="540" y="165" class="hdr">DESTINATION</text>
    <text x="1080" y="165" class="hdr">PLATFORM</text>
    <text x="1210" y="165" class="hdr">DELAY</text>

    <rect x="96" y="181" width="1208" height="371" rx="8" fill="#020203" stroke="#8f8f8b" stroke-width="1"/>
    <rect x="101" y="186" width="1198" height="361" rx="6" fill="#050506" stroke="#000" stroke-width="4"/>

    <g transform="translate(110 198)">
      <rect width="1175" height="58" fill="url(#cells)"/>
      <circle cx="15" cy="29" r="13" fill="#138a3d" stroke="#fff" stroke-width="2"/>
      <text x="15" y="30" class="iconText" fill="#fff">S</text>
      <text x="70" y="40" class="flap">18:45</text>
      <text x="260" y="40" class="flap">S8</text>
      <text x="405" y="40" class="flap-tight">AIRPORT</text>
      <text x="1025" y="40" class="flap">3</text>
    </g>

    <g transform="translate(110 267)">
      <rect width="1175" height="58" fill="url(#cells)"/>
      <g transform="translate(3 15)" fill="none" stroke="#fff" stroke-width="2">
        <rect x="1" y="1" width="24" height="19" rx="4"/>
        <line x1="5" y1="6" x2="21" y2="6"/>
        <circle cx="7" cy="23" r="2" fill="#fff"/><circle cx="20" cy="23" r="2" fill="#fff"/>
      </g>
      <text x="70" y="40" class="flap">18:48</text>
      <text x="260" y="40" class="flap">42</text>
      <text x="405" y="40" class="flap-tight">OLD TOWN</text>
      <text x="1025" y="40" class="flap">B</text>
    </g>

    <g transform="translate(110 336)">
      <rect width="1175" height="58" fill="url(#cells)"/>
      <rect x="3" y="15" width="24" height="26" rx="4" fill="#fff"/>
      <text x="15" y="29" class="iconText" fill="#111">R</text>
      <text x="70" y="40" class="flap">18:51</text>
      <text x="260" y="40" class="flap">RE1</text>
      <text x="405" y="40" class="flap-tight">RIVERPORT</text>
      <text x="1025" y="40" class="flap">7</text>
      <text x="1090" y="40" class="delay">(+4)</text>
    </g>

    <g transform="translate(110 405)">
      <rect width="1175" height="58" fill="url(#cells)"/>
      <rect x="3" y="15" width="24" height="26" rx="4" fill="#fff"/>
      <text x="15" y="29" class="iconText" fill="#111">T</text>
      <text x="70" y="40" class="flap">18:56</text>
      <text x="260" y="40" class="flap">T2</text>
      <text x="405" y="40" class="flap-tight">MARKET SQUARE</text>
      <text x="1025" y="40" class="flap">1</text>
    </g>

    <g transform="translate(110 474)">
      <rect width="1175" height="58" fill="url(#cells)"/>
      <circle cx="15" cy="29" r="13" fill="#138a3d" stroke="#fff" stroke-width="2"/>
      <text x="15" y="30" class="iconText" fill="#fff">S</text>
      <text x="70" y="40" class="flap">19:03</text>
      <text x="260" y="40" class="flap">S4</text>
      <text x="405" y="40" class="flap-tight">NORTH PARK</text>
      <text x="1025" y="40" class="flap">5</text>
    </g>
  </g>
</svg>