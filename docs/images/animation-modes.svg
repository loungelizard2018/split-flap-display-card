<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Split-flap animation mode comparison</title>
  <desc id="desc">Three miniature mechanical displays compare sequential, wave and simultaneous cell starts.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252529"/>
      <stop offset="1" stop-color="#070708"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242426"/>
      <stop offset="0.5" stop-color="#0a0a0b"/>
      <stop offset="1" stop-color="#1b1b1d"/>
    </linearGradient>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#f0f0eb;letter-spacing:1px}
      .label{font:700 19px Arial,sans-serif;fill:#e7e7e2;letter-spacing:.8px}
      .copy{font:400 15px Arial,sans-serif;fill:#b9b9b4}
      .glyph{font:500 31px 'DejaVu Sans Mono',monospace;fill:#f2c400;text-anchor:middle;dominant-baseline:middle}
      .time{font:600 14px 'DejaVu Sans Mono',monospace;fill:#79d7ff;text-anchor:middle}
    </style>
  </defs>

  <rect width="1400" height="520" fill="#0b1016"/>
  <text x="60" y="56" class="title">ANIMATION START MODES</text>

  <g transform="translate(60 95)">
    <rect width="400" height="350" rx="14" fill="url(#panel)" stroke="#777" stroke-width="1"/>
    <text x="26" y="42" class="label">SEQUENTIAL</text>
    <text x="26" y="68" class="copy">One changed cell completes before the next starts.</text>
    <g transform="translate(26 110)">
      <g>
        <rect x="0" y="0" width="62" height="88" rx="5" fill="url(#cell)" stroke="#000"/>
        <line x1="2" y1="44" x2="60" y2="44" stroke="#000"/>
        <text x="31" y="45" class="glyph">H</text>
        <text x="31" y="112" class="time">0 ms</text>
      </g>
      <g transform="translate(72 0)">
        <rect x="0" y="0" width="62" height="88" rx="5" fill="url(#cell)" stroke="#000"/>
        <line x1="2" y1="44" x2="60" y2="44" stroke="#000"/>
        <text x="31" y="45" class="glyph">O</text>
        <text x="31" y="112" class="time">+160</text>
      </g>
      <g transform="translate(144 0)">
        <rect x="0" y="0" width="62" height="88" rx="5" fill="url(#cell)" stroke="#000"/>
        <line x1="2" y1="44" x2="60" y2="44" stroke="#000"/>
        <text x="31" y="45" class="glyph">M</text>
        <text x="31" y="112" class="time">+320</text>
      </g>
      <g transform="translate(216 0)">
        <rect x="0" y="0" width="62" height="88" rx="5" fill="url(#cell)" stroke="#000"/>
        <line x1="2" y1="44" x2="60" y2="44" stroke="#000"/>
        <text x="31" y="45" class="glyph">E</text>
        <text x="31" y="112" class="time">+480</text>
      </g>
    </g>
    <text x="26" y="295" class="copy">Best for a slow, strongly mechanical presentation.</text>
  </g>

  <g transform="translate(500 95)">
    <rect width="400" height="350" rx="14" fill="url(#panel)" stroke="#777" stroke-width="1"/>
    <text x="26" y="42" class="label">MECHANICAL WAVE</text>
    <text x="26" y="68" class="copy">Cells overlap, but start with a short stagger.</text>
    <g transform="translate(26 110)">
      <g>
        <rect x="0" y="0" width="62" height="88" rx="5" fill="url(#cell)" stroke="#000"/>
        <line x1="2" y1="44" x2="60" y2="44" stroke="#000"/>
        <text x="31" y="45" class="glyph">H</text>
        <text x="31" y="112" class="time">0 ms</text>
      </g>
      <g transform="translate(72 0)">
        <rect x="0" y="0" width="62" height="88" rx="5" fill="url(#cell)" stroke="#000"/>
        <line x1="2" y1="44" x2="60" y2="44" stroke="#000"/>
        <text x="31" y="45" class="glyph">O</text>
        <text x="31" y="112" class="time">+18</text>
      </g>
      <g transform="translate(144 0)">
        <rect x="0" y="0" width="62" height="88" rx="5" fill="url(#cell)" stroke="#000"/>
        <line x1="2" y1="44" x2="60" y2="44" stroke="#000"/>
        <text x="31" y="45" class="glyph">M</text>
        <text x="31" y="112" class="time">+36</text>
      </g>
      <g transform="translate(216 0)">
        <rect x="0" y="0" width="62" height="88" rx="5" fill="url(#cell)" stroke="#000"/>
        <line x1="2" y1="44" x2="60" y2="44" stroke="#000"/>
        <text x="31" y="45" class="glyph">E</text>
        <text x="31" y="112" class="time">+54</text>
      </g>
    </g>
    <text x="26" y="295" class="copy">Recommended balance of speed and visible movement.</text>
  </g>

  <g transform="translate(940 95)">
    <rect width="400" height="350" rx="14" fill="url(#panel)" stroke="#777" stroke-width="1"/>
    <text x="26" y="42" class="label">SIMULTANEOUS</text>
    <text x="26" y="68" class="copy">All changed cells begin at the same moment.</text>
    <g transform="translate(26 110)">
      <g>
        <rect x="0" y="0" width="62" height="88" rx="5" fill="url(#cell)" stroke="#000"/>
        <line x1="2" y1="44" x2="60" y2="44" stroke="#000"/>
        <text x="31" y="45" class="glyph">H</text>
        <text x="31" y="112" class="time">0 ms</text>
      </g>
      <g transform="translate(72 0)">
        <rect x="0" y="0" width="62" height="88" rx="5" fill="url(#cell)" stroke="#000"/>
        <line x1="2" y1="44" x2="60" y2="44" stroke="#000"/>
        <text x="31" y="45" class="glyph">O</text>
        <text x="31" y="112" class="time">0 ms</text>
      </g>
      <g transform="translate(144 0)">
        <rect x="0" y="0" width="62" height="88" rx="5" fill="url(#cell)" stroke="#000"/>
        <line x1="2" y1="44" x2="60" y2="44" stroke="#000"/>
        <text x="31" y="45" class="glyph">M</text>
        <text x="31" y="112" class="time">0 ms</text>
      </g>
      <g transform="translate(216 0)">
        <rect x="0" y="0" width="62" height="88" rx="5" fill="url(#cell)" stroke="#000"/>
        <line x1="2" y1="44" x2="60" y2="44" stroke="#000"/>
        <text x="31" y="45" class="glyph">E</text>
        <text x="31" y="112" class="time">0 ms</text>
      </g>
    </g>
    <text x="26" y="295" class="copy">Fastest option for frequently changing dashboards.</text>
  </g>
</svg>