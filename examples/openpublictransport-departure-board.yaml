# Registers the custom Lovelace card.
type: custom:split-flap-display-card

# Selects the structured public-transport departure-board renderer.
display_mode: departure_board

# Entity containing the departure array and station metadata.
entity: sensor.central_station_departures

# Attribute containing the list of departure records.
departure_attribute: departures

# Attribute used as the automatic subtitle below the title.
station_name_attribute: station_name

# Main heading printed above the board.
title: DEPARTURES

# Optional fixed subtitle.
# Leave empty to use station_name_attribute automatically.
subtitle: ""

# Number of physical departure rows rendered by the card.
visible_rows: 5

# Shows the TIME, LINE, DESTINATION, PLATFORM and DELAY headings.
show_column_headers: true

# Shows the current Home Assistant local time in the heading.
show_header_clock: true

# Builds the board from completely empty cells when the card is first rendered.
animate_on_first_load: true

# Uses one real blank-to-final flap for every populated cell.
# All cells in one row start together.
initial_animation_style: direct

# Waits this many milliseconds before the first startup row begins.
initial_animation_delay: 450

# Duration in milliseconds of one startup flap.
initial_flip_duration: 220

# Base delay between startup rows.
initial_row_stagger: 90

# Startup rhythm for wheel mode:
# simultaneous, wave, scatter or mixed.
initial_start_pattern: mixed

# Maximum irregular cell offset in mixed or scatter mode.
initial_start_spread: 420

# Delay per column in wave mode.
initial_cell_stagger: 9

# Character displayed before the first-load animation.
# A single space creates an empty board.
initial_fill_char: " "

# Allows replay by clicking the instrument or pressing Enter/Space.
# Leave false on a normal dashboard.
replay_on_tap: false

# Uses stable row-atomic live updates.
# direct: one flap from the current value to the new value.
# wheel: advances through the complete character wheel.
live_update_style: direct

# Starts changed rows together during direct live updates.
start_mode: simultaneous

# Optional delay between changed rows during direct live updates.
# Zero prevents later departure text from appearing shifted.
live_row_stagger: 0

# Used only for individual changed cells in wheel mode.
cell_stagger: 4

# Duration in milliseconds of one direct live-update flap.
flip_duration: 118

# Duration in milliseconds of one character-wheel step.
step_duration: 58

# Maximum number of cells processed together in sequential wheel mode.
max_parallel_cells: 1

# Shrinks the complete instrument proportionally to the Lovelace column.
fit_to_card: true

# Prevents enlargement above the natural physical size.
allow_upscale: false

# Maximum enlargement factor when allow_upscale is enabled.
max_fit_scale: 1

# Shows four aircraft-instrument-style cross-head screws.
screws: true

# Removes the normal Home Assistant card background around the instrument.
transparent_card: true

# Natural width of one physical flap cell before responsive scaling.
cell_width: 34

# Natural height of one physical flap cell before responsive scaling.
cell_height: 50

# Horizontal gap between adjacent physical cells.
cell_gap: 3

# Vertical gap between departure rows.
row_gap: 8

# Font weight used for letters and numbers on the flaps.
glyph_weight: 500

# Glyph size as a fraction of the configured cell height.
glyph_scale: 0.61

# Vertical glyph offset that keeps E, F and H centre strokes readable.
glyph_offset_y: -1.5

# Configures the physical width of each departure-board field.
board_columns:
  # Number of cells reserved for the transport symbol.
  mode: 2

  # Number of cells reserved for the departure time.
  time: 5

  # Number of cells reserved for the line designation.
  line: 5

  # Number of cells reserved for the destination text.
  destination: 20

  # Number of cells reserved for platform, track or bus bay.
  platform: 3

  # Number of cells reserved for delay or cancellation information.
  delay: 6

  # Number of empty physical cells inserted between adjacent fields.
  gap: 1

# Configures colours for structured departure data.
departure_colors:
  # Colour for on-time departures and normal route information.
  normal: "#f2c400"

  # Colour for positive or negative delay values.
  delayed: "#ff5263"

  # Colour for cancelled departures.
  cancelled: "#ff3347"

  # Colour for the column headings.
  header: "#aaa89e"

# Maps detected transport modes to built-in or Material Design icons.
transport_icon_map:
  # Standard bus symbol.
  bus: mdi:bus

  # Built-in green S-Bahn badge with a white S.
  sbahn: splitflap:sbahn

  # Built-in German ICE-style badge.
  ice: splitflap:ice

  # Built-in German IC/EC-style badge.
  ic: splitflap:ic

  # Generic train symbol for unclassified rail services.
  train: mdi:train

  # Built-in RE/RB/IRE/MEX badge based on the line prefix.
  regional: splitflap:regional

  # Built-in blue German U-Bahn badge.
  subway: splitflap:ubahn

  # Tram or streetcar symbol.
  tram: mdi:tram

  # Ferry symbol.
  ferry: mdi:ferry

  # Fallback symbol for an unclassified transport type.
  unknown: mdi:transit-connection-variant
