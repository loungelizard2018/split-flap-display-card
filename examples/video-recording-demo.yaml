# Registers the custom Lovelace card.
type: custom:split-flap-display-card

# Selects the structured public-transport departure-board renderer.
display_mode: departure_board

# Entity containing the departure array and station metadata.
entity: sensor.central_station_departures

# Attribute containing the list of departure records.
departure_attribute: departures

# Attribute used as the automatic subtitle.
station_name_attribute: station_name

# Main heading printed above the board.
title: DEPARTURES

# Number of physical departure rows shown in the recording.
visible_rows: 5

# Starts the complete board from empty flaps.
animate_on_first_load: true

# Performs one real blank-to-final flap per populated cell.
# All cells in one row move together.
initial_animation_style: direct

# Keeps the empty board visible for one second before movement starts.
initial_animation_delay: 1000

# Makes the physical flap movement easy to see in the recording.
initial_flip_duration: 260

# Keeps a loose top-to-bottom order between rows.
initial_row_stagger: 55

# Gives the startup a controlled irregular mechanical rhythm.
# mixed combines the row order with different start offsets per cell.
initial_start_pattern: mixed

# Maximum additional start offset per populated cell.
initial_start_spread: 36

# Used by the wave pattern; retained here for easy experimentation.
initial_cell_stagger: 6

# Uses completely empty starting cells.
initial_fill_char: " "

# Allows replay by clicking or pressing Enter/Space on the card.
replay_on_tap: true

# Keeps later Home Assistant sensor updates stable and compact.
live_update_style: direct

# Starts all changed live rows together.
start_mode: simultaneous

# Prevents delay between changed live rows.
live_row_stagger: 0

# Used only if live_update_style is changed to wheel.
cell_stagger: 4

# Duration of direct live-update flaps.
flip_duration: 118

# Duration of one character-wheel step in wheel mode.
step_duration: 58

# Shrinks the full instrument proportionally to its Lovelace column.
fit_to_card: true

# Prevents enlargement above the natural physical size.
allow_upscale: false

# Shows the instrument mounting screws.
screws: true

# Removes the normal Home Assistant card background around the instrument.
transparent_card: true
