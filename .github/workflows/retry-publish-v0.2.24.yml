name: Retry publish v0.2.24 smooth animation engine

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retry-publish-v0.2.24.yml"

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate animation engine and documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          main = Path('split-flap-display-card.js')
          text = main.read_text()
          assert "Version: 0.2.23" in text
          assert "const VERSION = '0.2.23';" in text
          assert 'performanceAnimationMethods' not in text
          text = text.replace(
              "import { updateMethods } from './split-flap-update.js?v=0.2.23';",
              "import { updateMethods } from './split-flap-update.js?v=0.2.23';\nimport { performanceAnimationMethods } from './split-flap-performance.js?v=0.2.24';"
          )
          text = text.replace(
              "  updateMethods,\n);",
              "  updateMethods,\n  performanceAnimationMethods,\n);"
          )
          main.write_text(text)

          for path in Path('.').glob('split-flap-*.js'):
              source = path.read_text().replace('?v=0.2.23', '?v=0.2.24')
              if path.name == 'split-flap-display-card.js':
                  source = source.replace('Version: 0.2.23', 'Version: 0.2.24')
                  source = source.replace("const VERSION = '0.2.23';", "const VERSION = '0.2.24';")
              path.write_text(source)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          assert package['version'] == '0.2.23'
          package['version'] = '0.2.24'
          check = package['scripts']['check']
          if 'split-flap-performance.js' not in check:
              check = check.replace(
                  'node --check split-flap-wheel-start.js',
                  'node --check split-flap-wheel-start.js && node --check split-flap-performance.js'
              )
          package['scripts']['check'] = check
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          readme_path = Path('README.md')
          readme = readme_path.read_text().replace('v0.2.23', 'v0.2.24')
          anchor = '- Optional click or keyboard replay for demonstrations and recordings\n'
          extra = (
              '- Non-destructive replay: the existing board remains visible until each physical flap starts moving\n'
              '- Compositor-driven Web Animations with a round-robin wheel scheduler instead of timer-driven cell batches\n'
          )
          if extra not in readme:
              readme = readme.replace(anchor, anchor + extra)
          note_anchor = 'Startup and later sensor updates are handled separately.\n'
          note = (
              'Startup and later sensor updates are handled separately.\n\n'
              'Version 0.2.24 replaces the timer/reflow-heavy loop with a compositor-driven engine. '
              'Wheel steps are distributed round-robin across the board, so cells no longer settle in large visible blocks. '
              'Replay keeps the populated board visible until each individual flap starts moving. '
              'Parallel movement and intermediate steps are reduced adaptively on large departure boards.\n'
          )
          readme = readme.replace(note_anchor, note, 1)
          readme = readme.replace('initial_max_parallel_cells: 28', 'initial_max_parallel_cells: 12')
          readme = readme.replace('step_duration: 50', 'step_duration: 88')
          readme_path.write_text(readme)

          changelog = Path('CHANGELOG.md')
          previous = changelog.read_text() if changelog.exists() else ''
          entry = (
              '# Changelog\n\n'
              '## 0.2.24\n\n'
              '- Replaced forced-layout and timer-driven flips with compositor Web Animations.\n'
              '- Added round-robin wheel scheduling for continuous large-board motion.\n'
              '- Made click replay non-destructive; the populated board is no longer cleared.\n'
              '- Kept unchanged cells and transport badges visible during replay.\n'
              '- Added adaptive parallelism and intermediate-step limits.\n\n'
          )
          if previous.startswith('# Changelog'):
              previous = previous.split('\n', 1)[1].lstrip()
          changelog.write_text(entry + previous)

          test_path = Path('tests/performance-animation.test.mjs')
          test_path.write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import { effectiveParallelLimit, wheelStepBounds, performanceAnimationMethods } from '../split-flap-performance.js';

          test('large boards cap parallel compositor work', () => {
            const limit = effectiveParallelLimit({ initial_max_parallel_cells: 40 }, 300);
            assert.ok(limit >= 8 && limit <= 12);
          });

          test('large boards retain motion with fewer intermediate steps', () => {
            assert.deepEqual(
              wheelStepBounds({ initial_wheel_steps_min: 3, initial_wheel_steps_max: 6 }, 300),
              { minSteps: 2, maxSteps: 4 }
            );
          });

          test('replay requests the non-destructive path', () => {
            const calls = [];
            const context = {
              _config: { replay_on_tap: true }, _rendered: true, _hass: {},
              _initialAnimationPending: false, _liveUpdateRunning: false,
              _scheduleInitialBuild(delay, options) { calls.push({ delay, options }); }
            };
            performanceAnimationMethods._replayInitialAnimation.call(context);
            assert.deepEqual(calls, [{ delay: 0, options: { replay: true } }]);
          });

          test('replay scheduling never primes the board with blanks', () => {
            let primed = 0;
            let scheduledDelay = null;
            const oldWindow = globalThis.window;
            globalThis.window = {
              setTimeout(_callback, delay) { scheduledDelay = delay; return 7; },
              clearTimeout() {}
            };
            try {
              const context = {
                _rendered: true, _hass: {}, _config: { initial_animation_delay: 1000 },
                _initialBuildRunId: 0, _initialAnimationTimer: null,
                _cancelInitialAnimationTimer() { this._initialBuildRunId += 1; },
                _primeBoardWithFillCharacter() { primed += 1; }
              };
              performanceAnimationMethods._scheduleInitialBuild.call(context, 1000, { replay: true });
              assert.equal(primed, 0);
              assert.equal(scheduledDelay, 80);
            } finally {
              globalThis.window = oldWindow;
            }
          });
          """.replace(/^          /gm, ''))
          PY

      - name: Validate source and tests
        shell: bash
        run: |
          npm run check
          grep -Fq "const VERSION = '0.2.24';" split-flap-display-card.js
          grep -Fq 'performanceAnimationMethods' split-flap-display-card.js
          if grep -q 'offsetHeight' split-flap-performance.js; then
            echo 'Forced layout found in performance engine'
            exit 1
          fi

      - name: Commit release sources
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add split-flap-*.js package.json README.md CHANGELOG.md tests/performance-animation.test.mjs
          git commit -m 'fix: make split-flap animation continuous and non-destructive'
          git push origin main

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git tag -a v0.2.24 -m 'Split Flap Display Card v0.2.24'
          git push origin v0.2.24
          gh release create v0.2.24 --verify-tag --title 'v0.2.24' --notes 'Compositor animation engine, round-robin wheel scheduling, adaptive concurrency and non-destructive replay.'
          gh release view v0.2.24 --json tagName,isDraft,isPrerelease,url > RELEASE_V0.2.24_VERIFIED.json
          git add RELEASE_V0.2.24_VERIFIED.json
          git commit -m 'docs: record v0.2.24 release verification'
          git push origin main
