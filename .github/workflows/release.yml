name: Publish release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package version
        id: version
        shell: bash
        run: |
          version="$(node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); process.stdout.write(pkg.version)")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Synchronise runtime version strings
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-version.mjs

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add split-flap-display-card.js split-flap-config.js split-flap-render.js split-flap-update.js README.md
          git commit -m "Synchronise runtime version v${{ steps.version.outputs.version }}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Stop until synchronised commit is processed
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: exit 0

      - name: Run syntax checks and regression tests
        if: steps.sync.outputs.changed != 'true'
        shell: bash
        run: npm run check

      - name: Create GitHub release when missing
        if: steps.sync.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes
