name: Publish release

on:
  push:
    branches:
      - main
    paths-ignore:
      - CI_FAILURE.log
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package version
        id: version
        shell: bash
        run: |
          version="$(node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); process.stdout.write(pkg.version)")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Apply generated source updates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ensure-german-transport-badges.mjs
          node scripts/ensure-start-variation.mjs
          node scripts/ensure-calm-wheel-start.mjs
          node scripts/ensure-startup-settles.mjs
          node scripts/ensure-fluid-flow.mjs
          node scripts/ensure-animation-performance.mjs
          node scripts/sync-badge-docs.mjs

          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          ffmpeg -y \
            -i docs/images/split-flap-display-demo.mp4 \
            -vf "fps=5,scale=220:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=48:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer:bayer_scale=5" \
            -loop 0 \
            docs/images/split-flap-display-demo.gif

          node scripts/sync-readme-gif.mjs
          node scripts/sync-version.mjs

          if git diff --quiet; then
            echo "Generated sources are already synchronised."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            split-flap-display-card.js \
            split-flap-config.js \
            split-flap-render.js \
            split-flap-update.js \
            split-flap-performance.js \
            split-flap-performance-profile.js \
            split-flap-flow-scheduler.js \
            split-flap-transport-badges.js \
            split-flap-start-patterns.js \
            split-flap-wheel-start.js \
            split-flap-styles.js \
            README.md \
            docs/images/split-flap-display-demo.gif \
            examples/openpublictransport-departure-board.yaml \
            examples/video-recording-demo.yaml \
            tests
          git commit -m "Synchronise generated sources v${{ steps.version.outputs.version }}"
          git push

      - name: Run syntax checks and regression tests
        id: checks
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee CI_FAILURE.log

      - name: Save failed check output
        if: steps.checks.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CI_FAILURE.log
          git commit -m "Record release check failure" || true
          git push
          exit 1

      - name: Remove stale failure report
        if: steps.checks.outcome == 'success'
        shell: bash
        run: |
          if [ -f CI_FAILURE.log ] && git ls-files --error-unmatch CI_FAILURE.log >/dev/null 2>&1; then
            git rm CI_FAILURE.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove resolved release check report"
            git push
          fi

      - name: Create GitHub release when missing
        if: steps.checks.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          target="$(git rev-parse HEAD)"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi

          gh release create "$tag" \
            --target "$target" \
            --title "$tag" \
            --generate-notes
