name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check split-flap-display-card.js
      - name: Validate HACS metadata
        run: |
          node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('hacs.json','utf8'));if(h.filename!=='split-flap-display-card.js')process.exit(1)"
