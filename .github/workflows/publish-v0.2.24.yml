name: Publish v0.2.24 smooth animation engine

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.2.24.yml"

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate compositor animation engine
        shell: python
        run: |
          from pathlib import Path
          import json

          main = Path('split-flap-display-card.js')
          text = main.read_text()
          assert "Version: 0.2.23" in text
          assert "const VERSION = '0.2.23';" in text
          assert "performanceAnimationMethods" not in text
          text = text.replace(
              "import { updateMethods } from './split-flap-update.js?v=0.2.23';",
              "import { updateMethods } from './split-flap-update.js?v=0.2.23';\nimport { performanceAnimationMethods } from './split-flap-performance.js?v=0.2.24';"
          )
          text = text.replace(
              "  updateMethods,\n);",
              "  updateMethods,\n  performanceAnimationMethods,\n);"
          )
          main.write_text(text)

          for path in Path('.').glob('split-flap-*.js'):
              source = path.read_text()
              source = source.replace('?v=0.2.23', '?v=0.2.24')
              if path.name == 'split-flap-display-card.js':
                  source = source.replace('Version: 0.2.23', 'Version: 0.2.24')
                  source = source.replace("const VERSION = '0.2.23';", "const VERSION = '0.2.24';")
              path.write_text(source)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          assert package['version'] == '0.2.23'
          package['version'] = '0.2.24'
          check = package['scripts']['check']
          if 'split-flap-performance.js' not in check:
              check = check.replace(
                  'node --check split-flap-wheel-start.js',
                  'node --check split-flap-wheel-start.js && node --check split-flap-performance.js'
              )
          package['scripts']['check'] = check
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          readme = Path('README.md')
          text = readme.read_text().replace('v0.2.23', 'v0.2.24')
          feature_anchor = '- Optional click or keyboard replay for demonstrations and recordings\n'
          addition = (
              '- Non-destructive replay: the existing board remains visible until each physical flap starts moving\n'
              '- Compositor-driven Web Animations with a round-robin wheel scheduler instead of timer-driven cell batches\n'
          )
          if addition not in text:
              text = text.replace(feature_anchor, feature_anchor + addition)
          animation_anchor = '## Animation model\n\nStartup and later sensor updates are handled separately.\n'
          animation_note = '''## Animation model

Startup and later sensor updates are handled separately.

Version 0.2.24 replaces the timer/reflow-heavy animation loop with a compositor-driven engine. Wheel steps are distributed round-robin across the board, so one group of cells no longer finishes completely before the next group begins. Replay no longer clears a populated board: existing characters remain visible until their own flap starts moving. The engine also adapts the number of parallel cells and the number of intermediate wheel steps for large departure boards.
'''
          text = text.replace(animation_anchor, animation_note)
          text = text.replace('initial_max_parallel_cells: 28', 'initial_max_parallel_cells: 12')
          text = text.replace('step_duration: 50', 'step_duration: 88')
          readme.write_text(text)

          changelog = Path('CHANGELOG.md')
          prior = changelog.read_text() if changelog.exists() else '# Changelog\n'
          entry = '''# Changelog

## 0.2.24

- Replaced per-cell forced reflows and timer-synchronised flips with compositor-driven Web Animations.
- Added a round-robin wheel scheduler so large departure boards animate continuously instead of in visible blocks.
- Made replay non-destructive: clicking the board no longer blanks every character during the replay delay.
- Kept transport badges and unchanged cells visible throughout replay.
- Added adaptive limits for parallel flap movement and intermediate wheel steps on large boards.
- Preserved the row-atomic live-update queue and all existing YAML options.

'''
          if prior.startswith('# Changelog\n'):
              prior = prior[len('# Changelog\n'):].lstrip('\n')
          changelog.write_text(entry + prior)

      - name: Add animation-engine tests
        shell: bash
        run: |
          cat > tests/performance-animation.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import {
            effectiveParallelLimit,
            wheelStepBounds,
            performanceAnimationMethods,
          } from '../split-flap-performance.js';

          test('large boards use an adaptive compositor-safe parallel limit', () => {
            const limit = effectiveParallelLimit({ initial_max_parallel_cells: 40 }, 300);
            assert.ok(limit >= 8);
            assert.ok(limit <= 12);
          });

          test('large boards reduce intermediate wheel steps without removing motion', () => {
            assert.deepEqual(
              wheelStepBounds({ initial_wheel_steps_min: 3, initial_wheel_steps_max: 6 }, 300),
              { minSteps: 2, maxSteps: 4 }
            );
          });

          test('replay schedules a non-destructive build', () => {
            const calls = [];
            const context = {
              _config: { replay_on_tap: true },
              _rendered: true,
              _hass: {},
              _initialAnimationPending: false,
              _liveUpdateRunning: false,
              _hasPlayedInitialBuild: true,
              _scheduleInitialBuild(delay, options) { calls.push({ delay, options }); },
            };
            performanceAnimationMethods._replayInitialAnimation.call(context);
            assert.deepEqual(calls, [{ delay: 0, options: { replay: true } }]);
          });

          test('replay scheduling does not prime the board with blank characters', () => {
            let primed = 0;
            let scheduled = null;
            const oldWindow = globalThis.window;
            globalThis.window = {
              setTimeout(callback, delay) { scheduled = { callback, delay }; return 7; },
              clearTimeout() {},
            };
            try {
              const context = {
                _rendered: true,
                _hass: {},
                _config: { initial_animation_delay: 1000 },
                _initialBuildRunId: 0,
                _initialAnimationTimer: null,
                _cancelInitialAnimationTimer() { this._initialBuildRunId += 1; },
                _primeBoardWithFillCharacter() { primed += 1; },
              };
              performanceAnimationMethods._scheduleInitialBuild.call(context, 1000, { replay: true });
              assert.equal(primed, 0);
              assert.equal(scheduled.delay, 80);
            } finally {
              globalThis.window = oldWindow;
            }
          });
          EOF

      - name: Validate JavaScript and tests
        shell: bash
        run: |
          npm run check
          grep -Fq "const VERSION = '0.2.24';" split-flap-display-card.js
          grep -Fq "performanceAnimationMethods" split-flap-display-card.js
          grep -Fq "Web Animations" split-flap-performance.js
          if grep -q "offsetHeight" split-flap-performance.js; then
            echo 'Performance animation engine contains a forced layout read'
            exit 1
          fi

      - name: Commit release sources
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add split-flap-*.js package.json README.md CHANGELOG.md tests/performance-animation.test.mjs
          git commit -m 'fix: make split-flap animation continuous and non-destructive'
          git push origin main

      - name: Create v0.2.24 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git tag -a v0.2.24 -m 'Split Flap Display Card v0.2.24'
          git push origin v0.2.24
          gh release create v0.2.24 \
            --verify-tag \
            --title 'v0.2.24' \
            --notes 'Animation reliability release: compositor-driven physical flips, round-robin wheel scheduling for large departure boards, adaptive concurrency, and non-destructive replay that never blanks the populated board.'
          gh release view v0.2.24 --json tagName,isDraft,isPrerelease,url > RELEASE_V0.2.24_VERIFIED.json
          git add RELEASE_V0.2.24_VERIFIED.json
          git commit -m 'docs: record v0.2.24 release verification'
          git push origin main
